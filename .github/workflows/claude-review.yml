name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review of this Python data/ML project with the
            following focus areas:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Readability and maintainability

            2. **Security**
               - Check for secrets/credentials committed anywhere
               - Validate input handling on any code that touches external
                 or public data (see PUBLIC_DATA_APPLICATION_COMMENTS.md)

            3. **Performance**
               - Identify potential bottlenecks in data processing code
               - Review any database/file I/O for efficiency

            4. **Testing**
               - Verify adequate coverage in tests/ for new/changed code
               - Review test quality and edge cases

            5. **Documentation**
               - Ensure new code is reasonably documented
               - Verify README/CHANGELOG updates for user-facing changes

            Provide detailed feedback using inline comments for specific
            issues. Use top-level comments for general observations.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
