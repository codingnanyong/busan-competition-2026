name: Create Linear issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: Linear issue title without the COD- prefix
        required: true
        type: string
      description:
        description: Linear issue description
        required: false
        type: string

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Linear issue on the contest project
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: COD
          LINEAR_PROJECT_SLUG: 83133e455764
          LINEAR_PROJECT_NAME: 부산 IMD 생활취약지역 분석 2026
          LINEAR_ISSUE_TITLE: ${{ inputs.title }}
          LINEAR_ISSUE_DESCRIPTION: ${{ inputs.description }}
        run: python3 .github/scripts/create_linear_issue.py
