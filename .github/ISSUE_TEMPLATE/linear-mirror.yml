name: Linear mirror
description: Create the GitHub copy of a Linear work item
title: "COD-"
body:
  - type: markdown
    attributes:
      value: >-
        Create one GitHub Issue for one Linear issue. Keep the title, description,
        priority, milestone, due date, and state aligned in both systems.
  - type: input
    id: linear_url
    attributes:
      label: Linear issue URL
      placeholder: https://linear.app/codingnanyong/issue/COD-123
    validations:
      required: true
  - type: dropdown
    id: linear_status
    attributes:
      label: Linear status
      options:
        - Todo
        - In Progress
        - In Review
        - Done
        - Canceled
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Copy the goal from Linear.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the completion conditions from Linear.
    validations:
      required: true
  - type: textarea
    id: synchronization
    attributes:
      label: Synchronization checklist
      value: |
        - [ ] Title and description match Linear
        - [ ] Priority, milestone, due date, and assignee match Linear
        - [ ] Linear contains this GitHub Issue link
        - [ ] PR will include both `Closes COD-___` and `Closes #___`
    validations:
      required: true
